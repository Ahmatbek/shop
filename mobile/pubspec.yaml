name: shop_app
description: Simple shop app (Flutter + Bloc + Spring Boot API) for the mid-term project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^4.0.7
  shimmer: ^4.0.0
  flutter_svg: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
