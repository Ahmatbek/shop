server.port=8080
server.error.include-message=always

spring.datasource.url=jdbc:h2:file:./data/shopdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: secret must be at least 32 characters. Override with env var JWT_SECRET in real use.
app.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-32chars}
app.jwt.expiration-ms=86400000
